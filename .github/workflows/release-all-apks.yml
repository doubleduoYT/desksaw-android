name: Release all historical Android APKs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-all-apks.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.runs.outputs.matrix }}
      count: ${{ steps.runs.outputs.count }}
    steps:
      - name: Collect successful historical Android build runs
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          runs = []
          page = 1

          while True:
              url = f"https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)
              batch = data.get("workflow_runs", [])
              if not batch:
                  break
              runs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          selected = []
          for run in runs:
              path = run.get("path") or ""
              name = run.get("name") or ""
              if run.get("conclusion") != "success":
                  continue
              if not path.startswith(".github/workflows/build-android"):
                  continue
              if "Build Android" not in name:
                  continue
              selected.append(
                  {
                      "run_id": run["id"],
                      "sha": run["head_sha"],
                      "path": path,
                      "run_name": name,
                      "run_number": run["run_number"],
                      "created_at": run["created_at"],
                      "event": run["event"],
                      "branch": run.get("head_branch") or "",
                  }
              )

          selected.sort(key=lambda x: (x["created_at"], x["run_id"]))
          matrix = json.dumps({"include": selected}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"matrix={matrix}\n")
              f.write(f"count={len(selected)}\n")

          print(f"Selected {len(selected)} successful historical Android build runs.")
          for item in selected:
              print(
                  f'  run {item["run_id"]} | {item["path"]} | '
                  f'{item["sha"][:12]} | {item["created_at"]}'
              )
          PY

  rebuild:
    needs: prepare
    if: ${{ needs.prepare.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout exact historical build commit
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Expose preinstalled Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Setup Godot 4.7 and export templates
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          csharp: false
          export-templates: true

      - name: Install workflow parser
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Replay historical build commands
        env:
          TARGET_RUN_ID: ${{ matrix.run_id }}
          TARGET_RUN_NAME: ${{ matrix.run_name }}
          TARGET_RUN_NUMBER: ${{ matrix.run_number }}
          TARGET_RUN_CREATED_AT: ${{ matrix.created_at }}
          TARGET_RUN_EVENT: ${{ matrix.event }}
          TARGET_RUN_BRANCH: ${{ matrix.branch }}
          TARGET_SHA: ${{ matrix.sha }}
          TARGET_WORKFLOW: ${{ matrix.path }}
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          import yaml

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          workflow_path = workspace / os.environ["TARGET_WORKFLOW"]
          run_id = os.environ["TARGET_RUN_ID"]
          staging = workspace / "recovered-apk"
          staging.mkdir(parents=True, exist_ok=True)

          if not workflow_path.is_file():
              raise SystemExit(f"Historical workflow is missing: {workflow_path}")

          data = yaml.safe_load(workflow_path.read_text(encoding="utf-8"))
          jobs = data.get("jobs") or {}
          job = jobs.get("build")
          if not job:
              for candidate in jobs.values():
                  if isinstance(candidate, dict) and candidate.get("steps"):
                      job = candidate
                      break
          if not job:
              raise SystemExit("Could not find a build job in historical workflow")

          child_env = os.environ.copy()
          child_env.pop("GH_TOKEN", None)
          child_env.pop("GITHUB_TOKEN", None)
          child_env["GITHUB_SHA"] = os.environ["TARGET_SHA"]
          child_env["GITHUB_REF_NAME"] = os.environ.get("TARGET_RUN_BRANCH", "")

          env_file = runner_temp / f"historical-env-{run_id}.txt"
          path_file = runner_temp / f"historical-path-{run_id}.txt"
          output_file = runner_temp / f"historical-output-{run_id}.txt"
          for p in (env_file, path_file, output_file):
              p.write_text("", encoding="utf-8")
          child_env["GITHUB_ENV"] = str(env_file)
          child_env["GITHUB_PATH"] = str(path_file)
          child_env["GITHUB_OUTPUT"] = str(output_file)

          def expand_value(value):
              value = str(value)
              replacements = {
                  "$" + "{{ github.workspace }}": str(workspace),
                  "$" + "{{ runner.temp }}": str(runner_temp),
                  "$" + "{{ github.sha }}": os.environ["TARGET_SHA"],
              }
              for old, new in replacements.items():
                  value = value.replace(old, new)
              return value

          for k, v in (job.get("env") or {}).items():
              child_env[str(k)] = expand_value(v)

          def apply_env_file():
              if not env_file.exists():
                  return
              lines = env_file.read_text(encoding="utf-8", errors="replace").splitlines()
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if "<<" in line:
                      key, marker = line.split("<<", 1)
                      i += 1
                      vals = []
                      while i < len(lines) and lines[i] != marker:
                          vals.append(lines[i])
                          i += 1
                      child_env[key] = "\n".join(vals)
                  elif "=" in line:
                      key, val = line.split("=", 1)
                      child_env[key] = val
                  i += 1
              env_file.write_text("", encoding="utf-8")

          def apply_path_file():
              if not path_file.exists():
                  return
              additions = [
                  line for line in path_file.read_text(encoding="utf-8", errors="replace").splitlines()
                  if line.strip()
              ]
              if additions:
                  child_env["PATH"] = os.pathsep.join(additions + [child_env.get("PATH", "")])
              path_file.write_text("", encoding="utf-8")

          steps = job.get("steps") or []
          for index, step in enumerate(steps, 1):
              if not isinstance(step, dict) or "run" not in step:
                  continue
              name = step.get("name") or f"run step {index}"
              script = expand_value(step["run"])
              step_env = child_env.copy()
              for k, v in (step.get("env") or {}).items():
                  step_env[str(k)] = expand_value(v)

              working = step.get("working-directory")
              if working:
                  cwd = Path(expand_value(working))
                  if not cwd.is_absolute():
                      cwd = workspace / cwd
              else:
                  cwd = workspace

              script_file = runner_temp / f"historical-{run_id}-{index}.sh"
              script_file.write_text(script, encoding="utf-8")
              print(f"\n===== {name} =====")
              result = subprocess.run(
                  ["bash", "--noprofile", "--norc", "-e", "-o", "pipefail", str(script_file)],
                  cwd=str(cwd),
                  env=step_env,
              )
              if result.returncode != 0:
                  raise SystemExit(
                      f"Historical step failed for run {run_id}: {name} "
                      f"(exit {result.returncode})"
                  )
              apply_env_file()
              apply_path_file()

          upload_paths = []
          for step in steps:
              if not isinstance(step, dict):
                  continue
              uses = str(step.get("uses") or "")
              if not uses.startswith("actions/upload-artifact@"):
                  continue
              raw = (step.get("with") or {}).get("path", "")
              for line in str(raw).splitlines():
                  line = line.strip()
                  if not line or line.startswith("!"):
                      continue
                  upload_paths.append(expand_value(line))

          apk_paths = []
          seen = set()
          for spec in upload_paths:
              full = Path(spec)
              if not full.is_absolute():
                  full = workspace / full
              matches = glob.glob(str(full), recursive=True)
              if not matches and full.exists():
                  matches = [str(full)]
              for match in matches:
                  p = Path(match)
                  candidates = [p] if p.is_file() else list(p.rglob("*.apk")) if p.is_dir() else []
                  for apk in candidates:
                      if apk.suffix.lower() != ".apk":
                          continue
                      resolved = str(apk.resolve())
                      if resolved not in seen:
                          seen.add(resolved)
                          apk_paths.append(apk)

          if not apk_paths:
              fallback = list((workspace / "source" / "build").glob("*.apk"))
              apk_paths.extend(fallback)

          if not apk_paths:
              raise SystemExit(f"No APK produced for historical run {run_id}")

          badging_candidates = list(workspace.glob("source/build/badging.txt"))
          badging_text = ""
          for badging in badging_candidates:
              if badging.is_file():
                  badging_text += badging.read_text(encoding="utf-8", errors="replace") + "\n"

          version_match = re.search(r"versionName='([^']+)'", badging_text)
          version = version_match.group(1) if version_match else "unknown"
          safe_version = re.sub(r"[^0-9A-Za-z._-]+", "-", version).strip("-") or "unknown"

          assets = []
          multiple = len(apk_paths) > 1
          for n, apk in enumerate(apk_paths, 1):
              original = apk.name
              lower = original.lower() + " " + os.environ["TARGET_RUN_NAME"].lower()
              flavor = "touchfix" if "touch" in lower else "standard"
              extra = f"-{n}" if multiple else ""
              asset_name = f"desksaw-android-{safe_version}-{flavor}-run-{run_id}{extra}.apk"
              destination = staging / asset_name
              shutil.copy2(apk, destination)
              digest = hashlib.sha256(destination.read_bytes()).hexdigest()
              assets.append(
                  {
                      "asset": asset_name,
                      "source_path": str(apk.relative_to(workspace)),
                      "size": destination.stat().st_size,
                      "sha256": digest,
                      "version_name": version,
                      "flavor": flavor,
                  }
              )

          metadata = {
              "status": "success",
              "original_run_id": int(run_id),
              "original_run_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
              "workflow_name": os.environ["TARGET_RUN_NAME"],
              "workflow_path": os.environ["TARGET_WORKFLOW"],
              "run_number": int(os.environ["TARGET_RUN_NUMBER"]),
              "event": os.environ["TARGET_RUN_EVENT"],
              "branch": os.environ["TARGET_RUN_BRANCH"],
              "head_sha": os.environ["TARGET_SHA"],
              "created_at": os.environ["TARGET_RUN_CREATED_AT"],
              "rebuilt_at": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "assets": assets,
              "note": "Original GitHub Actions artifact expired; rebuilt from the historical commit and workflow commands.",
          }
          (staging / f"run-{run_id}.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(metadata, ensure_ascii=False, indent=2))
          PY

      - name: Upload rebuilt APK for release assembly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-${{ matrix.run_id }}
          path: recovered-apk/
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: [prepare, rebuild]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download every rebuilt APK
        uses: actions/download-artifact@v4
        with:
          pattern: rebuilt-*
          path: recovered
          merge-multiple: true

      - name: Build archive manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("recovered")
          records = []
          for p in sorted(root.glob("run-*.json")):
              records.append(json.loads(p.read_text(encoding="utf-8")))

          if not records:
              raise SystemExit("No rebuilt run metadata found.")

          failed = [r for r in records if r.get("status") != "success"]
          if failed:
              raise SystemExit(f"{len(failed)} historical builds did not succeed.")

          expected = int("${{ needs.prepare.outputs.count }}")
          if len(records) != expected:
              raise SystemExit(f"Expected {expected} rebuilt runs, found {len(records)}.")

          apk_count = sum(len(r.get("assets", [])) for r in records)
          manifest = {
              "repository": "${{ github.repository }}",
              "generated_at": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "historical_successful_build_runs": expected,
              "apk_assets": apk_count,
              "rebuild_notice": (
                  "Original GitHub Actions artifacts had expired after 14 days. "
                  "These APKs were rebuilt from each historical run's exact commit "
                  "and workflow commands; byte-for-byte hashes may differ from the expired originals."
              ),
              "runs": records,
          }
          Path("recovered/apk-archive-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"Prepared {apk_count} APK assets from {expected} historical runs.")
          PY

      - name: Create or update archive release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: actions-apk-archive-2026-09-19
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          # deskSaw Android — GitHub Actions APK archive

          This release collects APKs corresponding to every successful historical Android build workflow run in this repository that was found when the archive job ran.

          The original GitHub Actions artifacts used a 14-day retention period and had already expired. GitHub does not allow workflow runs older than one month to be re-run, so each APK here was rebuilt from that run's exact historical commit and the build commands stored in that commit's workflow file.

          Because external build tools and timestamps can change, these recovered APKs should be treated as faithful rebuilds, not guaranteed byte-for-byte copies of the expired artifacts. See `apk-archive-manifest.json` for the source run ID, commit SHA, workflow path, version, size, and SHA-256 of each recovered APK.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG"               --repo "$GITHUB_REPOSITORY"               --title "deskSaw Android — Actions APK Archive"               --notes-file release-notes.md
          else
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target main               --title "deskSaw Android — Actions APK Archive"               --notes-file release-notes.md
          fi

          mapfile -t APKS < <(find recovered -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No APK files found for upload." >&2
            exit 1
          fi

          gh release upload "$TAG"             --repo "$GITHUB_REPOSITORY"             --clobber             "${APKS[@]}"             recovered/apk-archive-manifest.json

          URL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url)"
          echo "Release: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Uploaded APK count: ${#APKS[@]}" >> "$GITHUB_STEP_SUMMARY"
