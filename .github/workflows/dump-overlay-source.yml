name: Dump Overlay Source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble overlay source
        shell: bash
        run: |
          set -euo pipefail
          cat overlay/v4/chunks/*.b64 | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/overlay-v4.zip"
          mkdir -p "$RUNNER_TEMP/overlay-v4"
          unzip -q "$RUNNER_TEMP/overlay-v4.zip" -d "$RUNNER_TEMP/overlay-v4"
          find "$RUNNER_TEMP/overlay-v4" -maxdepth 8 -type f -print
      - name: Upload overlay source
        uses: actions/upload-artifact@v4
        with:
          name: overlay-v4-source
          path: ${{ runner.temp }}/overlay-v4
          if-no-files-found: error
          retention-days: 2
