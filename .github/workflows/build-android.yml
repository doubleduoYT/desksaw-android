name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android.yml"
      - "patches/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages required by Godot 4.7
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest"

      - name: Setup Godot 4.7 and export templates
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          csharp: false
          export-templates: true

      - name: Verify toolchain
        shell: bash
        run: |
          godot --version
          java -version
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/build-tools/35.0.1"

      - name: Reassemble Android port patch
        shell: bash
        run: |
          cat patches/chunks/*.b64 | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/android-port.patch"
          test "$(wc -c < "$RUNNER_TEMP/android-port.patch")" -eq 12544
          grep -q "TransparentWindowCompat.gd" "$RUNNER_TEMP/android-port.patch"

      - name: Fetch pinned deskSaw source and apply Android patch
        shell: bash
        run: |
          git init source
          git -C source remote add origin https://github.com/dee-dee-catorce/desksaw.git
          git -C source fetch --depth=1 origin e3acdd3f8f28de02573a3647c7ab82a6ba1cdb0a
          git -C source checkout --detach FETCH_HEAD
          git -C source apply --check "$RUNNER_TEMP/android-port.patch"
          git -C source apply "$RUNNER_TEMP/android-port.patch"

          # The upstream tree references godot-console, but its addon files are not
          # present in the source checkout. Restore the addon and use a stable path
          # for the Console autoload instead of relying on a missing UID cache.
          rm -rf source/addons/godot-console
          git clone --depth=1 https://github.com/4d49/godot-console.git source/addons/godot-console
          sed -i 's#Console="\*uid://dc5wc5117h2vk"#Console="*res://addons/godot-console/scripts/console.gd"#' source/project.godot

          # Android port is intentionally a normal opaque full-screen app. Keeping
          # the desktop transparent-window flags makes Godot require a Gradle build.
          sed -i 's#window/size/transparent=true#window/size/transparent=false#' source/project.godot
          sed -i 's#window/per_pixel_transparency/allowed=true#window/per_pixel_transparency/allowed=false#' source/project.godot

          # Standard template export does not use Gradle. Min/Target SDK overrides
          # are Gradle-only in Godot 4.7, so remove those overrides and use the
          # template defaults instead.
          sed -i '/^gradle_build\/min_sdk=/d' source/export_presets.cfg
          sed -i '/^gradle_build\/target_sdk=/d' source/export_presets.cfg

          # Make the APK visible in the Android launcher.
          sed -i 's#package/show_as_launcher_app=false#package/show_as_launcher_app=true#' source/export_presets.cfg

          grep -q 'platform="Android"' source/export_presets.cfg
          grep -q 'package/show_as_launcher_app=true' source/export_presets.cfg
          grep -q 'window/size/transparent=false' source/project.godot
          grep -q 'window/per_pixel_transparency/allowed=false' source/project.godot
          grep -q 'Console="\*res://addons/godot-console/scripts/console.gd"' source/project.godot
          test -f source/addons/godot-console/scripts/console.gd
          ! grep -q '^gradle_build/min_sdk=' source/export_presets.cfg
          ! grep -q '^gradle_build/target_sdk=' source/export_presets.cfg

      - name: Configure Android signing and Godot editor paths
        shell: bash
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # action-setup-godot/Godot 4.7 loads editor_settings-4.7.tres in CI.
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp "$HOME/.config/godot/editor_settings-4.7.tres" "$HOME/.config/godot/editor_settings-4.tres"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import project
        shell: bash
        run: |
          godot --headless --verbose --path source --import

      - name: Export debug APK
        shell: bash
        run: |
          mkdir -p source/build
          godot --headless --verbose --path source \
            --export-debug Android "$GITHUB_WORKSPACE/source/build/desksaw-android.apk"
          test -s source/build/desksaw-android.apk
          ls -lh source/build/desksaw-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: desksaw-android-apk
          path: source/build/desksaw-android.apk
          if-no-files-found: error
          retention-days: 14
