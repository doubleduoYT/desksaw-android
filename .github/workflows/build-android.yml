name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android.yml"
      - "patches/**"
      - "overlay/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages required by Godot 4.7
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Setup Godot 4.7 and export templates
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          csharp: false
          export-templates: true

      - name: Verify toolchain
        shell: bash
        run: |
          godot --version
          java -version
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/build-tools/35.0.1"

      - name: Reassemble base Android port patch
        shell: bash
        run: |
          cat patches/chunks/*.b64 | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/android-port.patch"
          test "$(wc -c < "$RUNNER_TEMP/android-port.patch")" -eq 12544
          grep -q "TransparentWindowCompat.gd" "$RUNNER_TEMP/android-port.patch"

      - name: Reassemble desktop-pet overlay payload
        shell: bash
        run: |
          cat overlay/v2/chunks/*.b64 | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/desksaw-overlay-v2.zip"
          echo "2b7083641d03cd2c1d5d72fa18a63399f11c91dd4b4cc9c8f0e586eeff3a9ba6  $RUNNER_TEMP/desksaw-overlay-v2.zip" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/desksaw-overlay-v2"
          mkdir -p "$RUNNER_TEMP/desksaw-overlay-v2"
          unzip -q "$RUNNER_TEMP/desksaw-overlay-v2.zip" -d "$RUNNER_TEMP/desksaw-overlay-v2"
          test -f "$RUNNER_TEMP/desksaw-overlay-v2/apply_android_overlay.py"
          test -f "$RUNNER_TEMP/desksaw-overlay-v2/android/src/main/java/com/godot/game/DeskSawOverlayService.java"

      - name: Fetch pinned deskSaw source and apply base Android patch
        shell: bash
        run: |
          git init source
          git -C source remote add origin https://github.com/dee-dee-catorce/desksaw.git
          git -C source fetch --depth=1 origin e3acdd3f8f28de02573a3647c7ab82a6ba1cdb0a
          git -C source checkout --detach FETCH_HEAD
          git -C source apply --check "$RUNNER_TEMP/android-port.patch"
          git -C source apply "$RUNNER_TEMP/android-port.patch"

          # The upstream tree references godot-console, but its addon files are not
          # present in the source checkout. Restore it before Godot initializes.
          rm -rf source/addons/godot-console
          git clone --depth=1 https://github.com/4d49/godot-console.git source/addons/godot-console
          sed -i 's#Console="\*uid://dc5wc5117h2vk"#Console="*res://addons/godot-console/scripts/console.gd"#' source/project.godot
          test -f source/addons/godot-console/scripts/console.gd

      - name: Install official Godot Gradle build template
        shell: bash
        run: |
          # Transparent TYPE_APPLICATION_OVERLAY output and custom Android Java require
          # Godot's Gradle build. Preload the overlay project's valid Gradle settings
          # before asking Godot to install res://android/build.
          cp "$RUNNER_TEMP/desksaw-overlay-v2/godot/project.godot" source/project.godot
          cp "$RUNNER_TEMP/desksaw-overlay-v2/godot/export_presets.cfg" source/export_presets.cfg

          rm -rf source/android/build
          godot --headless --verbose --path source --install-android-build-template
          test -d source/android/build
          test -f source/android/build/build.gradle
          find source/android/build -path '*/com/godot/game/GodotApp.java' -print -quit | grep -q .

      - name: Apply Android desktop-pet overlay integration
        shell: bash
        run: |
          python "$RUNNER_TEMP/desksaw-overlay-v2/apply_android_overlay.py" \
            "$GITHUB_WORKSPACE/source" \
            "$GITHUB_WORKSPACE/source/android/build"

          grep -q 'gradle_build/use_gradle_build=true' source/export_presets.cfg
          grep -q 'gradle_build/min_sdk=24' source/export_presets.cfg
          grep -q 'gradle_build/target_sdk=35' source/export_presets.cfg
          grep -q 'window/size/transparent=true' source/project.godot
          grep -q 'window/per_pixel_transparency/allowed=true' source/project.godot
          grep -q 'window/handheld/orientation=6' source/project.godot
          grep -q 'sensors/enable_gravity=true' source/project.godot
          grep -q 'sensors/enable_gyroscope=true' source/project.godot
          grep -q 'Console="\*res://addons/godot-console/scripts/console.gd"' source/project.godot

          MANIFEST="$(grep -rl 'DeskSawOverlayService' source/android/build --include='AndroidManifest.xml' | head -n1)"
          test -n "$MANIFEST"
          grep -q 'android.permission.SYSTEM_ALERT_WINDOW' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' "$MANIFEST"
          grep -q 'foregroundServiceType="specialUse"' "$MANIFEST"

          find source/android/build -name DeskSawOverlayService.java -print -quit | grep -q .
          find source/android/build -name DeskSawOverlayPlugin.java -print -quit | grep -q .
          grep -q 'Console.create_command("gyroGravity"' source/Scripts/impo/commands.gd

      - name: Configure Android signing and Godot editor paths
        shell: bash
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp "$HOME/.config/godot/editor_settings-4.7.tres" "$HOME/.config/godot/editor_settings-4.tres"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import project and validate scripts
        shell: bash
        run: |
          godot --headless --verbose --path source --import

      - name: Export debug APK with Gradle
        shell: bash
        run: |
          mkdir -p source/build
          godot --headless --verbose --path source \
            --export-debug Android "$GITHUB_WORKSPACE/source/build/desksaw-android.apk"
          test -s source/build/desksaw-android.apk
          ls -lh source/build/desksaw-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: desksaw-android-apk
          path: source/build/desksaw-android.apk
          if-no-files-found: error
          retention-days: 14
